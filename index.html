<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Currency Exchange</title>

    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main
      class="min-vh-100 d-flex justify-content-center align-items-center p-3"
    >
      <div class="exchange-card shadow">
        <h1 class="text-center mb-4">Currency Exchange</h1>

        <!-- Amount -->
        <div class="mb-4">
          <label for="amount" class="form-label fw-semibold">Amount</label>

          <input
            type="number"
            class="form-control form-control-lg"
            id="amount"
            value="1"
            min="0"
            step="any"
            placeholder="Enter amount"
          />
        </div>

        <!-- From Currency -->
        <div class="currency-box mb-3">
          <img id="fromFlag" class="currency-flag" alt="Currency flag" />

          <select id="fromCurrency" class="form-select form-select-lg"></select>
        </div>

        <!-- To Currency -->
        <div class="currency-box mb-4">
          <img id="toFlag" class="currency-flag" alt="Currency flag" />

          <select id="toCurrency" class="form-select form-select-lg"></select>
        </div>

        <!-- Result -->
        <div id="result" class="result-box text-center mb-4">
          Select currencies and click Convert
        </div>

        <!-- Convert Button -->
        <button id="convertBtn" class="btn btn-primary btn-lg w-100">
          Convert
        </button>
      </div>
    </main>

    <script src="js/bootstrap.min.js"></script>
    <script type="module" src="./js/data.js"></script>
    <script type="module" src="js/index.js"></script>
  </body>
</html>
